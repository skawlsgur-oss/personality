<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 컴포넌트 디자인 데모 쇼케이스 (Storybook)</title>
  
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      background-color: #F4F3F7;
      padding: 20px;
      display: block;
      min-height: 100vh;
    }

    .demo-wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }

    .demo-header {
      background-color: var(--color-primary);
      color: white;
      border: var(--neo-border);
      box-shadow: var(--neo-shadow-lg);
      border-radius: var(--radius-lg);
      padding: 24px 32px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .demo-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .demo-tab-btn {
      background-color: white;
      color: #1E1E24;
      border: var(--neo-border);
      box-shadow: var(--neo-shadow-sm);
      border-radius: var(--radius-md);
      padding: 10px 18px;
      font-weight: 700;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .demo-tab-btn.active {
      background-color: var(--color-accent);
      box-shadow: var(--neo-shadow-md);
      transform: translateY(-2px);
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }

    .demo-card {
      background-color: white;
      border: var(--neo-border);
      box-shadow: var(--neo-shadow-md);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .demo-card-title {
      font-size: 1.125rem;
      font-weight: 800;
      border-bottom: 2px dashed #E9ECEF;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .demo-tag {
      background-color: #F1F3F5;
      border: 1px solid #CED4DA;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #495057;
    }

    .preview-box {
      border: 1px dashed #CED4DA;
      border-radius: var(--radius-md);
      padding: 16px;
      background-color: #FAFAFA;
    }
  </style>
</head>
<body>

  <div class="demo-wrapper">
    <!-- Header -->
    <header class="demo-header">
      <div>
        <h1 class="text-h1" style="font-size: 2rem;">🎨 UI Component Storybook & Showcase</h1>
        <p class="text-body-sm" style="color: rgba(255,255,255,0.9); margin-top: 4px;">
          대학생 창업 성향 테스트 웹사이트의 모든 독립 모듈형 UI 컴포넌트를 미리보기하고 테스트할 수 있는 데모 페이지입니다.
        </p>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="./index.html" class="demo-tab-btn" style="text-decoration: none; display: flex; align-items: center; gap: 6px;">
          <span>🚀 실제 앱 실행하기</span>
        </a>
      </div>
    </header>

    <!-- Navigation Filter -->
    <nav class="demo-nav">
      <button class="demo-tab-btn active" data-filter="all">ALL (모든 컴포넌트)</button>
      <button class="demo-tab-btn" data-filter="nav">헤더 & 프로그레스 바</button>
      <button class="demo-tab-btn" data-filter="buttons">버튼 & 선택지 카드</button>
      <button class="demo-tab-btn" data-filter="forms">랜딩 인트로 폼</button>
      <button class="demo-tab-btn" data-filter="feedback">분석 로딩 모션</button>
      <button class="demo-tab-btn" data-filter="result">결과 카드 & 차트 & 궁합</button>
    </nav>

    <!-- Grid Container -->
    <div id="demo-grid" class="demo-grid">
      <!-- Dynamically injected via src/demo.js -->
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="./src/demo.js"></script>
</body>
</html>
